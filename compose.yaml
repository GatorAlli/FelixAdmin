services:
  database:
    image: postgres:10.23-bullseye
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_only
      POSTGRES_DB: felix_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - felix_test_database:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d felix_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  felix_test_database:

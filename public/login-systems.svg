      <rect x="0" y="0" width="134" height="134" rx="5" fill="#186636"/>
      <rect x="8" y="8" width="118" height="118" rx="2" stroke-opacity=".3"/>
      <circle cx="67" cy="67" r="48"/><circle cx="67" cy="67" r="10"/>
      <path d="M60 58C26 40 27 14 44 25C63 37 65 41 65 57M77 60C95 26 121 27 110 44C98 63 94 65 78 65M74 77C108 95 107 121 90 110C71 98 69 94 69 78M57 74C39 108 13 107 24 90C36 71 40 69 56 69"/>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" fill="none">
  <title>Felix building systems technical illustration</title>
  <desc>A custom illustrative arrangement of HVAC, lighting, fire detection, security, motor drives and building automation equipment.</desc>
  <defs>

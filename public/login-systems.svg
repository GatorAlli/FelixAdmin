    <text x="53" y="425">MOTOR DRIVE</text><text x="547" y="418">LIGHTING CONTROL</text>
    <text x="291" y="469">BUILDING AUTOMATION</text><text x="77" y="608">FIRE DETECTION</text><text x="546" y="608">SECURITY</text>
